[project]
name = "workhub"
version = "0.1.0"
description = "WorkHub —— 个人工作空间后端（FastAPI + Pydantic + SQLAlchemy + SQLite）"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
